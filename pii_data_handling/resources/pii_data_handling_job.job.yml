# A sample job for pii_data_handling.

resources:
  jobs:
    pii_data_handling_job:
      name: pii_data_handling_job

      #trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        #periodic:
          #interval: 1
          #unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: pii_data_handling_tagging
          notebook_task:
            notebook_path: ../src/pii_data_handling_tagging.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
