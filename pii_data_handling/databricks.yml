# This is a Declarative Automation Bundle definition for pii_data_handling.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: pii_data_handling
  uuid: 2df5de5c-b98d-476c-89ca-0be684b50008

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-98fbbe3f-dea0.cloud.databricks.com
    variables:
      catalog: db_academy
      schema: pii_data
    presets:
      name_prefix: dev_${workspace.current_user.short_name}_
  prod:
    mode: production
    workspace:
      host: https://dbc-98fbbe3f-dea0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/thidiemkieu.ky@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/thidiemkieu.ky@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: db_academy
      schema: pii_data
    presets:
      name_prefix: prod_
    permissions:
      - user_name: thidiemkieu.ky@gmail.com
        level: CAN_MANAGE
